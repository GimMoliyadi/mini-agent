name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      OPENAI_API_KEY: offline-test-key
      OPENAI_BASE_URL: http://127.0.0.1:9/v1
      OPENAI_MODEL: offline-test-model
      MINI_AGENT_HTTP_PROXY: ""
      NO_PROXY: "*"
      TOOL_APPROVAL_MODE: DENY
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and development checks
        run: python -m pip install -c requirements.lock -e ".[dev,mcp,code_index]" wheel sqlalchemy==2.1.4 alembic==1.20.0
      - name: Offline unit and integration regression
        run: python scripts/check.py
      - name: Real local MCP protocol integration
        run: python -m pytest -q tests/test_mcp_integration.py
      - name: Package and CLI smoke checks
        run: python scripts/check.py --packaging-only
      - name: Quick Start through a local HTTP provider
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python scripts/verify_quickstart.py --entry "$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')/mini-agent.exe"
          else
            python scripts/verify_quickstart.py --entry "$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')/mini-agent"
          fi

  real_web:
    name: Real FastAPI + React + Chromium (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: offline-test-key
      OPENAI_BASE_URL: http://127.0.0.1:9/v1
      OPENAI_MODEL: offline-test-model
      TOOL_APPROVAL_MODE: ALLOW
      MINI_AGENT_RUN_REAL_WEB_ACCEPTANCE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install real backend, browser and test dependencies
        run: python -m pip install -c requirements.lock -e ".[dev,browser]" fastapi uvicorn
      - name: Install Chromium and Linux browser dependencies
        run: python -m playwright install --with-deps chromium
      - name: Real FastAPI + React + TypeScript + Chromium integration
        run: python -m pytest -vv -s tests/test_real_web_acceptance.py
