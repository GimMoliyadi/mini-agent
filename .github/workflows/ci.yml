name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      OPENAI_API_KEY: offline-test-key
      OPENAI_BASE_URL: http://127.0.0.1:9/v1
      OPENAI_MODEL: offline-test-model
      MINI_AGENT_HTTP_PROXY: ""
      NO_PROXY: "*"
      TOOL_APPROVAL_MODE: DENY
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and development checks
        run: python -m pip install -c requirements.lock -e ".[dev]" wheel
      - name: Offline unit and integration regression
        run: python scripts/check.py
      - name: Lint
        run: python -m ruff check mini_agent benchmark examples tests scripts
      - name: Type check
        run: python -m mypy
      - name: Benchmark v1 (repeated deterministic acceptance)
        run: python benchmark/run_benchmark.py --repetitions 2 --output benchmark/reports/ci.json
      - name: Package and CLI smoke checks
        run: python scripts/check.py --packaging-only
      - name: Quick Start through a local HTTP provider
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python scripts/verify_quickstart.py --entry "$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')/mini-agent.exe"
          else
            python scripts/verify_quickstart.py --entry "$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')/mini-agent"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.os }}-${{ matrix.python }}
          path: benchmark/reports/ci.json
