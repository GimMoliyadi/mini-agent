name: offline-regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: offline-test-key
      OPENAI_BASE_URL: http://127.0.0.1:9/v1
      OPENAI_MODEL: offline-test-model
      MINI_AGENT_HTTP_PROXY: ""
      NO_PROXY: "*"
      TOOL_APPROVAL_MODE: DENY
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create test virtual environment
        run: python -m venv .venv
      - name: Install locked dependencies and build tools
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv/Scripts/python.exe -m pip install -r requirements.lock "setuptools>=65.5" wheel
          else
            .venv/bin/python -m pip install -r requirements.lock "setuptools>=65.5" wheel
          fi
      - name: Offline behavior regression
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv/Scripts/python.exe scripts/check.py
          else
            .venv/bin/python scripts/check.py
          fi
      - name: Offline packaging and installation
        if: ${{ always() }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv/Scripts/python.exe scripts/check.py --packaging-only
          else
            .venv/bin/python scripts/check.py --packaging-only
          fi
