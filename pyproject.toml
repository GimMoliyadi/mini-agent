[build-system]
requires = ["setuptools>=65.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent-lab"
version = "2.0.0"
description = "A verified coding agent built with LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "langchain>=1.4.4,<1.5",
    "langgraph>=1.2.14,<1.3",
    "langchain-openai>=1.7.0,<1.8",
    "langgraph-checkpoint-sqlite>=3.1.1,<3.2",
    "python-dotenv>=1.2.4,<2",
    "httpx[socks]>=0.28.1,<1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]

[project.scripts]
mini-agent = "mini_agent.launcher:main"

[project.optional-dependencies]
mcp = ["langchain-mcp-adapters>=0.3.2,<0.4"]
browser = ["playwright>=1.55,<2"]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<1", "mypy>=1.20,<2", "setuptools>=65.5", "wheel"]

[tool.setuptools]
py-modules = [
    "acceptance",
    "cli",
    "config",
    "configure",
    "file_safety",
    "launcher",
    "main",
    "process_runner",
    "runtime_guards",
    "tools",
]
include-package-data = false
packages = ["mini_agent", "mini_agent.tools"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["tests/fixtures", "demo_workspace", "docs", ".venv", ".tmp", ".state", ".home", ".install"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"] # Tests add the source checkout before compatibility imports.

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"] # Deliberately broken projects are agent inputs, not repository tests.
markers = ["live: real provider acceptance (requires --run-live)"]

[tool.mypy]
python_version = "3.11"
files = ["mini_agent"]
follow_imports = "silent"
check_untyped_defs = true
ignore_missing_imports = true
